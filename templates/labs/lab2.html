<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lab 2: 2FA Bypass</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="portfolio-container">
      <h1>Lab 2: Two-Factor Authentication Bypass</h1>
      <div class="lab-forms-container">
        <div class="lab-card">
          <h3>Vulnerable 2FA Flow</h3>
          <form action="/lab2/login-vulnerable" method="POST" class="lab-form">
            <div class="form-group">
              <input
                type="text"
                name="username"
                placeholder="Username (carlos)"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                name="password"
                placeholder="Password (montoya)"
                required
              />
            </div>
            <button type="submit" class="btn-lab">Login (Vuln)</button>
          </form>
        </div>
        <div class="lab-card">
          <h3>Secure 2FA Flow</h3>
          <form action="/lab2/login-secure" method="POST" class="lab-form">
            <div class="form-group">
              <input
                type="text"
                name="username"
                placeholder="Username (carlos)"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                name="password"
                placeholder="Password (montoya)"
                required
              />
            </div>
            <button type="submit" class="btn-home">Login (Secure)</button>
          </form>
        </div>
      </div>
      <br /><a href="/" class="btn-home">Back to Home</a>
    </div>
  </body>
</html>
