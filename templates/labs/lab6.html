<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lab 6: Brute-Force Protection</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="portfolio-container">
      <h1>Lab 6: Broken Brute-Force Protection, IP Block</h1>
      <div class="lab-forms-container">
        <div class="lab-card">
          <h3>Vulnerable Login (IP Block)</h3>
          <form action="/lab6/login-vulnerable" method="POST" class="lab-form">
            <div class="form-group">
              <input
                type="text"
                name="username"
                placeholder="Username"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                name="password"
                placeholder="Password"
                required
              />
            </div>
            <button type="submit" class="btn-lab">Login (Vuln)</button>
          </form>
        </div>
        <div class="lab-card">
          <h3>Secure Login (Account Lock)</h3>
          <form action="/lab6/login-secure" method="POST" class="lab-form">
            <div class="form-group">
              <input
                type="text"
                name="username"
                placeholder="Username"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                name="password"
                placeholder="Password"
                required
              />
            </div>
            <button type="submit" class="btn-home">Login (Secure)</button>
          </form>
        </div>
      </div>
      <br /><a href="/" class="btn-home">Back to Home</a>
    </div>
  </body>
</html>
