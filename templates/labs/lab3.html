<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lab 3: Password Reset</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="portfolio-container">
      <h1>Lab 3: Password Reset Broken Logic</h1>
      <div class="lab-forms-container">
        <div class="lab-card">
          <h3>Vulnerable Reset</h3>
          <form action="/lab3/forgot-vulnerable" method="POST" class="lab-form">
            <div class="form-group">
              <input
                type="text"
                name="username"
                placeholder="Target Username"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                name="new-password-1"
                placeholder="New Password"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="password"
                name="new-password-2"
                placeholder="Confirm Password"
                required
              />
            </div>
            <button type="submit" class="btn-lab">Reset (Vuln)</button>
          </form>
        </div>
        <div class="lab-card">
          <h3>Secure Reset</h3>
          <form action="/lab3/forgot-secure" method="POST" class="lab-form">
            <div class="form-group">
              <input
                type="text"
                name="username"
                placeholder="Target Username"
                required
              />
            </div>
            <button type="submit" class="btn-home">Send Reset Link</button>
          </form>
        </div>
      </div>
      <br /><a href="/" class="btn-home">Back to Home</a>
    </div>
  </body>
</html>
