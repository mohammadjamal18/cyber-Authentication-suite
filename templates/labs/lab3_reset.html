<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Secure Reset Password</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="container account-container">
      <h2>Set New Password</h2>
      <form method="POST" class="lab-form">
        <div class="form-group">
          <input
            type="password"
            name="new-password-1"
            placeholder="New Password"
            required
          />
        </div>
        <div class="form-group">
          <input
            type="password"
            name="new-password-2"
            placeholder="Confirm Password"
            required
          />
        </div>
        <button type="submit" class="btn-home">Change Password</button>
      </form>
    </div>
  </body>
</html>
